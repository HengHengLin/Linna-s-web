name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'content/reading/**'
      - 'public/reading.json'
      - 'src/reading.generated.json'
      - 'content/public/**'
      - 'public/content.json'
      - 'public/data/flows/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-flows.mjs
      - run: npm test
      - run: node scripts/check-reading-render.mjs
      - run: npm run build -- --base=/Linna-s-web/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
