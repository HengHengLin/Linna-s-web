name: Update licensed market flow snapshots
on:
  schedule:
    # After TFTC's 02:00 / 10:00 UTC refresh. US prior-session days, DST handled in code.
    - cron: '25 2,10 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-flow-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch licensed BTC snapshot (retain valid history on failure)
        id: update
        continue-on-error: true
        run: node scripts/update-flows.mjs
      - name: Validate retained or updated snapshots
        run: node scripts/verify-flows.mjs
      - name: Commit only flow snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/flows/btc.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh licensed BTC ETF flow snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report source failure
        if: steps.update.outcome == 'failure'
        run: exit 1
