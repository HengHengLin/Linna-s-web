<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 755" role="img" aria-labelledby="title desc"><title id="title">航空航天产业链｜研究框架示意图</title><desc id="desc">分别研究航空与航天，再验证商业需求；01 上游供给：材料 · 元器件，认证 · 可靠性；02 分系统：动力 · 航电，控制及其他分系统；03 制造集成：航空器制造，火箭 · 卫星制造；04 运营应用：发射 · 运营，航空服务 · 卫星应用；供给 → 分系统 → 制造集成 → 运营及应用；航空与航天并非同一市场。；不能把所有军工公司都归为商业航天。</desc><rect width="1280" height="755" fill="#101f35"/><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="60" y="65" fill="#62dfc4" font-size="18">LINNA RESEARCH LAB / RESEARCH FRAMEWORK</text><text x="60" y="129" fill="#f1f6fc" font-size="42" font-weight="700">航空航天产业链</text><text x="60" y="178" fill="#b7c8dc" font-size="23">分别研究航空与航天，再验证商业需求</text><rect x="60.0" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="60.0" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="80.0" y="280" fill="#62dfc4" font-size="25" font-weight="700">01 上游供给</text><text x="80.0" y="335" fill="#e6eff9" font-size="22">材料 · 元器件</text><text x="80.0" y="378" fill="#e6eff9" font-size="22">认证 · 可靠性</text><rect x="354.5" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="354.5" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="374.5" y="280" fill="#62dfc4" font-size="25" font-weight="700">02 分系统</text><text x="374.5" y="335" fill="#e6eff9" font-size="22">动力 · 航电</text><text x="374.5" y="378" fill="#e6eff9" font-size="22">控制及其他分系统</text><rect x="649.0" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="649.0" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="669.0" y="280" fill="#62dfc4" font-size="25" font-weight="700">03 制造集成</text><text x="669.0" y="335" fill="#e6eff9" font-size="22">航空器制造</text><text x="669.0" y="378" fill="#e6eff9" font-size="22">火箭 · 卫星制造</text><rect x="943.5" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="943.5" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="963.5" y="280" fill="#62dfc4" font-size="25" font-weight="700">04 运营应用</text><text x="963.5" y="335" fill="#e6eff9" font-size="22">发射 · 运营</text><text x="963.5" y="378" fill="#e6eff9" font-size="22">航空服务 · 卫星应用</text><text x="60" y="510" fill="#cbd9e9" font-size="23">供给 → 分系统 → 制造集成 → 运营及应用</text><text x="60" y="553" fill="#cbd9e9" font-size="23">航空与航天并非同一市场。</text><text x="60" y="596" fill="#cbd9e9" font-size="23">不能把所有军工公司都归为商业航天。</text><path d="M60 663H1220" stroke="#39536f"/><text x="60" y="708" fill="#62dfc4" font-size="22">研究框架示意图</text><text x="330" y="708" fill="#a9bdd3" font-size="20">非实时行情 · 非真实权重 · 不代表已审核投资结论</text></g></svg>