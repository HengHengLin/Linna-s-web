<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 755" role="img" aria-labelledby="title desc"><title id="title">创业板指产业共振｜研究框架示意图</title><desc id="desc">不同公司可能依赖同一种终端需求；AI 数据中心：光模块 · 光器件 · PCB，云厂商资本开支；动力电池与储能：出货量 · 产品价格，产能 · 成本 · 技术迭代；互联网证券：市场成交量，客户资产 · 市场周期；产业集中度：单只股票分散 ≠ 底层需求分散；按共同需求聚合公司，再检验风险集中程度。</desc><rect width="1280" height="755" fill="#101f35"/><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="60" y="65" fill="#62dfc4" font-size="18">LINNA RESEARCH LAB / RESEARCH FRAMEWORK</text><text x="60" y="129" fill="#f1f6fc" font-size="42" font-weight="700">创业板指产业共振</text><text x="60" y="178" fill="#b7c8dc" font-size="23">不同公司可能依赖同一种终端需求</text><rect x="60.0" y="230" width="374.6666666666667" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="60.0" y="230" width="374.6666666666667" height="5" rx="2" fill="#62dfc4"/><text x="80.0" y="280" fill="#62dfc4" font-size="25" font-weight="700">AI 数据中心</text><text x="80.0" y="335" fill="#e6eff9" font-size="22">光模块 · 光器件 · PCB</text><text x="80.0" y="378" fill="#e6eff9" font-size="22">云厂商资本开支</text><rect x="452.6666666666667" y="230" width="374.6666666666667" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="452.6666666666667" y="230" width="374.6666666666667" height="5" rx="2" fill="#62dfc4"/><text x="472.6666666666667" y="280" fill="#62dfc4" font-size="25" font-weight="700">动力电池与储能</text><text x="472.6666666666667" y="335" fill="#e6eff9" font-size="22">出货量 · 产品价格</text><text x="472.6666666666667" y="378" fill="#e6eff9" font-size="22">产能 · 成本 · 技术迭代</text><rect x="845.3333333333334" y="230" width="374.6666666666667" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="845.3333333333334" y="230" width="374.6666666666667" height="5" rx="2" fill="#62dfc4"/><text x="865.3333333333334" y="280" fill="#62dfc4" font-size="25" font-weight="700">互联网证券</text><text x="865.3333333333334" y="335" fill="#e6eff9" font-size="22">市场成交量</text><text x="865.3333333