<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 755" role="img" aria-labelledby="title desc"><title id="title">上证50盈利驱动｜研究框架示意图</title><desc id="desc">同一指数，不同的盈利逻辑；银行与保险：利率 · 信用风险，投资收益 · 负债成本；消费品牌：品牌 · 渠道库存，定价权 · 现金流；能源与资源：商品价格 · 成本，资本开支 · 扩产；科技与制造：订单 · 研发，竞争格局 · 估值；四类驱动并列比较，不构成行业权重分配。；国资参股 ≠ 实际控制；高股息需要现金流验证。</desc><rect width="1280" height="755" fill="#101f35"/><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="60" y="65" fill="#62dfc4" font-size="18">LINNA RESEARCH LAB / RESEARCH FRAMEWORK</text><text x="60" y="129" fill="#f1f6fc" font-size="42" font-weight="700">上证50盈利驱动</text><text x="60" y="178" fill="#b7c8dc" font-size="23">同一指数，不同的盈利逻辑</text><rect x="60.0" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="60.0" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="80.0" y="280" fill="#62dfc4" font-size="25" font-weight="700">银行与保险</text><text x="80.0" y="335" fill="#e6eff9" font-size="22">利率 · 信用风险</text><text x="80.0" y="378" fill="#e6eff9" font-size="22">投资收益 · 负债成本</text><rect x="354.5" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="354.5" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="374.5" y="280" fill="#62dfc4" font-size="25" font-weight="700">消费品牌</text><text x="374.5" y="335" fill="#e6eff9" font-size="22">品牌 · 渠道库存</text><text x="374.5" y="378" fill="#e6eff9" font-size="22">定价权 · 现金流</text><rect x="649.0" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="649.0" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="669.0" y="280" fill="#62dfc4" font-size="25" font-weight="700">能源与资源</text><text x="669.0" y="335" fill="#e6eff9" font-size="22">商品价格 · 成本</text><text x="669.0" y="378" fill="#e6eff9" font-size="22">资本开支 · 扩产</text><rect x="943.5" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="943.5" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="963.5" y="280" fill="#62dfc4" font-size="25" font-weight="700">科技与制造</text><text x="963.5" y="335" fill="#e6eff9" font-size="22">订单 · 研发</text><text x="963.5" y="378" fill="#e6eff9" font-size="22">竞争格局 · 估值</text><text x="60" y="510" fill="#cbd9e9" font-size="23">四类驱动并列比较，不构成行业权重分配。</text><text x="60" y="553" fill="#cbd9e9" font-size="23">国资参股 ≠ 实际控制；高股息需要现金流验证。</text><path d="M60 663H1220" stroke="#39536f"/><text x="60" y="708" fill="#62dfc4" font-size="22">研究框架示意图</text><text x="330" y="708" fill="#a9bdd3" font-size="20">非实时行情 · 非真实权重 · 不代表已审核投资结论</text></g></svg>