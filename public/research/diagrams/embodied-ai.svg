<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 755" role="img" aria-labelledby="title desc"><title id="title">AI 与具身智能产业链｜研究框架示意图</title><desc id="desc">三个并行研究层次，不把节点误作串行生产关系；AI 基础设施：芯片 → HBM → 先进封装，光通信 → 数据中心；机器人硬件：传感器 → 电机 → 减速器，执行器 → 整机；软件与应用：基础模型 → 感知与规划，控制 → 实际应用；技术演示 → 商业订单 → 规模交付：三个不同验证阶段；节点箭头为研究观察顺序，并非全部为上下游供货关系。；算力、硬件、软件的协作需以实际产品与交付证据验证。</desc><rect width="1280" height="755" fill="#101f35"/><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="60" y="65" fill="#62dfc4" font-size="18">LINNA RESEARCH LAB / RESEARCH FRAMEWORK</text><text x="60" y="129" fill="#f1f6fc" font-size="42" font-weight="700">AI 与具身智能产业链</text><text x="60" y="178" fill="#b7c8dc" font-size="23">三个并行研究层次，不把节点误作串行生产关系</text><rect x="60.0" y="230" width="374.6666666666667" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="60.0" y="230" width="374.6666666666667" height="5" rx="2" fill="#62dfc4"/><text x="80.0" y="280" fill="#62dfc4" font-size="25" font-weight="700">AI 基础设施</text><text x="80.0" y="335" fill="#e6eff9" font-size="22">芯片 → HBM → 先进封装</text><text x="80.0" y="378" fill="#e6eff9" font-size="22">光通信 → 数据中心</text><rect x="452.6666666666667" y="230" width="374.6666666666667" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="452.6666666666667" y="230" width="374.6666666666667" height="5" rx="2" fill="#62dfc4"/><text x="472.6666666666667" y="280" fill="#62dfc4" font-size="25" font-weight="700">机器人硬件</text><text x="472.6666666666667" y="335" fill="#e6eff9" font-size="22">传感器 → 电机 → 减速器</text><text x="472.6666666666667" y="378" fill="#e6eff9" font-size="22">执行器 → 整机</text><rect x="845.3333333333334" y="230" width="374.6666666666667" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="845.3333333333334" y="230" width="374.6666666666667" height="5" rx="2" fill="#62dfc4"/><text x="865.3333333333334" y="280" fill="#62dfc4" font-size="25" font-weight="700">软件与应用</text><text x="865.3333333333334" y="335" fill="#e6eff9" font-size="22">基础模型 → 感知与规划</text><text x="865.3333333333334" y="378" fill="#e6eff9" font-size="22">控制 → 实际应用</text><text x="60" y="510" fill="#cbd9e9" font-size="23">技术演示 → 商业订单 → 规模交付：三个不同验证阶段</text><text x="60" y="553" fill="#cbd9e9" font-size="23">节点箭头为研究观察顺序，并非全部为上下游供货关系。</text><text x="60" y="596" fill="#cbd9e9" font-size="23">算力、硬件、软件的协作需以实际产品与交付证据验证。</text><path d="M60 663H1220" stroke="#39536f"/><text x="60" y="708" fill="#62dfc4" font-size="22">研究框架示意图</text><text x="330" y="708" fill="#a9bdd3" font-size="20">非实时行情 · 非真实权重 · 不代表已审核投资结论</text></g></svg>