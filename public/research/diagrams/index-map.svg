<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 755" role="img" aria-labelledby="title desc"><title id="title">三大指数研究地图｜研究框架示意图</title><desc id="desc">从指数表象走向底层产业需求；科创50：半导体 · 先进制造 · 算力，科技产业暴露；上证50：金融 · 消费 · 能源资源，科技制造与多种盈利周期；创业板指：AI 数据中心 · 新能源，互联网证券与共同需求；指数规则 → 成分股权重 → 产业需求暴露；风险集中度 → ETF 产品比较；产业分类为研究视角，不代表已核验权重。</desc><rect width="1280" height="755" fill="#101f35"/><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="60" y="65" fill="#62dfc4" font-size="18">LINNA RESEARCH LAB / RESEARCH FRAMEWORK</text><text x="60" y="129" fill="#f1f6fc" font-size="42" font-weight="700">三大指数研究地图</text><text x="60" y="178" fill="#b7c8dc" font-size="23">从指数表象走向底层产业需求</text><rect x="60.0" y="230" width="374.6666666666667" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="60.0" y="230" width="374.6666666666667" height="5" rx="2" fill="#62dfc4"/><text x="80.0" y="280" fill="#62dfc4" font-size="25" font-weight="700">科创50</text><text x="80.0" y="335" fill="#e6eff9" font-size="22">半导体 · 先进制造 · 算力</text><text x="80.0" y="378" fill="#e6eff9" font-size="22">科技产业暴露</text><rect x="452.6666666666667" y="230" width="374.6666666666667" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="452.6666666666667" y="230" width="374.6666666666667" height="5" rx="2" fill="#62dfc4"/><text x="472.6666666666667" y="280" fill="#62dfc4" font-size="25" font-weight="700">上证50</text><text x="472.6666666666667" y="335" fill="#e6eff9" font-size="22">金融 · 消费 · 能源资源</text><text x="472.6666666666667" y="378" fill="#e6eff9" font-size="22">科技制造与多种盈利周期</text><rect x="845.3333333333334" y="230" width="374.6666666666667" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="845.3333333333334" y="230" width="374.6666666666667" height="5" rx="2" fill="#62dfc4"/><text x="865.3333333333334" y="280" fill="#62dfc4" font-size="25" font-weight="700">创业板指</text><text x="865.3333333333334" y="335" fill="#e6eff9" font-size="22">AI 数据中心 · 新能源</text><text x="865.3333333333334" y="378" fill="#e6eff9" font-size="22">互联网证券与共同需求</text><text x="60" y="510" fill="#cbd9e9" font-size="23">指数规则 → 成分股权重 → 产业需求暴露</text><text x="60" y="553" fill="#cbd9e9" font-size="23">风险集中度 → ETF 产品比较</text><text x="60" y="596" fill="#cbd9e9" font-size="23">产业分类为研究视角，不代表已核验权重。</text><path d="M60 663H1220" stroke="#39536f"/><text x="60" y="708" fill="#62dfc4" font-size="22">研究框架示意图</text><text x="330" y="708" fill="#a9bdd3" font-size="20">非实时行情 · 非真实权重 · 不代表已审核投资结论</text></g></svg>