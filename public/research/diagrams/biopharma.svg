<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 755" role="img" aria-labelledby="title desc"><title id="title">创新药研发商业化｜研究框架示意图</title><desc id="desc">研发成功、获批与商业成功需要分别验证；01 发现与临床前：靶点发现 · 药物筛选，临床前研究；02 临床研究：I 期 → II 期 → III 期，安全性 · 有效性；03 注册审批：申报 · 审评，适应症与监管要求；04 商业化：生产 · 市场准入，销售 · 回款；横向支持：CRO 研发服务 ｜ CDMO 工艺与生产；License-out：授权交易可发生于不同研发阶段。；交易总金额 ≠ 已收到现金；首付款、里程碑、分成须分开。</desc><rect width="1280" height="755" fill="#101f35"/><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="60" y="65" fill="#62dfc4" font-size="18">LINNA RESEARCH LAB / RESEARCH FRAMEWORK</text><text x="60" y="129" fill="#f1f6fc" font-size="42" font-weight="700">创新药研发商业化</text><text x="60" y="178" fill="#b7c8dc" font-size="23">研发成功、获批与商业成功需要分别验证</text><rect x="60.0" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="60.0" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="80.0" y="280" fill="#62dfc4" font-size="25" font-weight="700">01 发现与临床前</text><text x="80.0" y="335" fill="#e6eff9" font-size="22">靶点发现 · 药物筛选</text><text x="80.0" y="378" fill="#e6eff9" font-size="22">临床前研究</text><rect x="354.5" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="354.5" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="374.5" y="280" fill="#62dfc4" font-size="25" font-weight="700">02 临床研究</text><text x="374.5" y="335" fill="#e6eff9" font-size="22">I 期 → II 期 → III 期</text><text x="374.5" y="378" fill="#e6eff9" font-size="22">安全性 · 有效性</text><rect x="649.0" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="649.0" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="669.0" y="280" fill="#62dfc4" font-size="25" font-weight="700">03 注册审批</text><text x="669.0" y="335" fill="#e6eff9" font-size="22">申报 · 审评</text><text x="669.0" y="378" fill="#e6eff9" font-size="22">适应症与监管要求</text><rect x="943.5" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="943.5" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="963.5" y="280" fill="#62dfc4" font-size="25" font-weight="700">04 商业化</text><text x="963.5" y="335" fill="#e6eff9" font-size="22">生产 · 市场准入</text><text x="963.5" y="378" fill="#e6eff9" font-size="22">销售 · 回款</text><text x="60" y="510" fill="#cbd9e9" font-size="23">横向支持：CRO 研发服务 ｜ CDMO 工艺与生产</text><text x="60" y="553" fill="#cbd9e9" font-size="23">License-out：授权交易可发生于不同研发阶段。</text><text x="60" y="596" fill="#cbd9e9" font-size="23">交易总金额 ≠ 已收到现金；首付款、里程碑、分成须分开。</text><path d="M60 663H1220" stroke="#39536f"/><text x="60" y="708" fill="#62dfc4" font-size="22">研究框架示意图</text><text x="330" y="708" fill="#a9bdd3" font-size="20">非实时行情 · 非真实权重 · 不代表已审核投资结论</text></g></svg>