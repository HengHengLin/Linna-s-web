<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 755" role="img" aria-labelledby="title desc"><title id="title">科创50产业研究｜研究框架示意图</title><desc id="desc">从终端需求到财务结果的验证链条；01 终端需求：AI 算力 · 汽车电子，工业自动化 · 消费电子；02 设计与制造：芯片设计 · 晶圆代工，先进封装 · 产能利用率；03 设备与材料：国产替代 · 产品认证，设备订单 · 研发投入；04 财务验证：毛利率 · 折旧，资本开支 · 经营现金流；需求 → 设计与制造 → 设备材料 → 财务验证；技术突破、订单增长与利润增长需要分别核验。</desc><rect width="1280" height="755" fill="#101f35"/><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="60" y="65" fill="#62dfc4" font-size="18">LINNA RESEARCH LAB / RESEARCH FRAMEWORK</text><text x="60" y="129" fill="#f1f6fc" font-size="42" font-weight="700">科创50产业研究</text><text x="60" y="178" fill="#b7c8dc" font-size="23">从终端需求到财务结果的验证链条</text><rect x="60.0" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="60.0" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="80.0" y="280" fill="#62dfc4" font-size="25" font-weight="700">01 终端需求</text><text x="80.0" y="335" fill="#e6eff9" font-size="22">AI 算力 · 汽车电子</text><text x="80.0" y="378" fill="#e6eff9" font-size="22">工业自动化 · 消费电子</text><rect x="354.5" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="354.5" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="374.5" y="280" fill="#62dfc4" font-size="25" font-weight="700">02 设计与制造</text><text x="374.5" y="335" fill="#e6eff9" font-size="22">芯片设计 · 晶圆代工</text><text x="374.5" y="378" fill="#e6eff9" font-size="22">先进封装 · 产能利用率</text><rect x="649.0" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="649.0" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="669.0" y="280" fill="#62dfc4" font-size="25" font-weight="700">03 设备与材料</text><text x="669.0" y="335" fill="#e6eff9" font-size="22">国产替代 · 产品认证</text><text x="669.0" y="378" fill="#e6eff9" font-size="22">设备订单 · 研发投入</text><rect x="943.5" y="230" width="276.5" height="220" rx="14" fill="#19304b" stroke="#39536f"/><rect x="943.5" y="230" width="276.5" height="5" rx="2" fill="#62dfc4"/><text x="963.5" y="280" fill="#62dfc4" font-size="25" font-weight="700">04 财务验证</text><text x="963.5" y="335" fill="#e6eff9" font-size="22">毛利率 · 折旧</text><text x="963.5" y="378" fill="#e6eff9" font-size="22">资本开支 · 经营现金流</text><text x="60" y="510" fill="#cbd9e9" font-size="23">需求 → 设计与制造 → 设备材料 → 财务验证</text><text x="60" y="553" fill="#cbd9e9" font-size="23">技术突破、订单增长与利润增长需要分别核验。</text><path d="M60 663H1220" stroke="#39536f"/><text x="60" y="708" fill="#62dfc4" font-size="22">研究框架示意图</text><text x="330" y="708" fill="#a9bdd3" font-size="20">非实时行情 · 非真实权重 · 不代表已审核投资结论</text></g></svg>